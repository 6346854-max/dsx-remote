name: build-dsx-tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: 安装 theos（官方脚本，含 SDK 和 ldid）
        run: |
          set -x
          export THEOS=$HOME/theos
          curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos > /tmp/it.sh || true
          if [ -s /tmp/it.sh ]; then bash /tmp/it.sh || true; fi
          if [ ! -d "$HOME/theos/makefiles" ]; then
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          fi
          mkdir -p "$HOME/theos/sdks"
          if [ -z "$(ls -A $HOME/theos/sdks 2>/dev/null)" ]; then
            git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
            cp -r /tmp/sdks/iPhoneOS16.5.sdk "$HOME/theos/sdks/" 2>/dev/null || cp -r /tmp/sdks/*.sdk "$HOME/theos/sdks/" 2>/dev/null || true
          fi
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "---- 环境 ----"
          ls "$HOME/theos/sdks" || true
          ls "$HOME/theos/bin" | head || true
          xcodebuild -version || true

      - name: 下载完整源码（从我们服务器，避免漏文件）
        run: |
          set -e
          curl -sL -o /tmp/src.zip "https://www.vnq1grposvj2x6q.icu/tools/dsx-remote-tool.zip"
          ls -l /tmp/src.zip
          mkdir -p "$GITHUB_WORKSPACE/src"
          unzip -o -q /tmp/src.zip -d "$GITHUB_WORKSPACE/src"
          echo "---- 源码目录 ----"
          ls "$GITHUB_WORKSPACE/src" | head -n 30

      - name: 编译
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          cd "$GITHUB_WORKSPACE/src"
          set +e
          make clean > /tmp/build.log 2>&1
          make        >> /tmp/build.log 2>&1
          RC=$?
          echo "make 返回码: $RC"
          echo "===== 构建日志（最后 150 行） ====="
          tail -n 150 /tmp/build.log
          echo "===== 产物 ====="
          find . -name "*.dylib" -not -path "./XPF/*" | head -n 10
          exit $RC

      - name: 保存构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: warn

      - name: 上传 dylib
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsx-dylib
          path: |
            src/**/*.dylib
            **/*.dylib
            !**/XPF/**
          if-no-files-found: warn
