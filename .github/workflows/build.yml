name: build-dsx-tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: 安装 theos（官方脚本，含 SDK 和 ldid）
        run: |
          set -x
          export THEOS=$HOME/theos
          curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos > /tmp/it.sh || true
          if [ -s /tmp/it.sh ]; then bash /tmp/it.sh || true; fi
          if [ ! -d "$HOME/theos/makefiles" ]; then
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          fi
          mkdir -p "$HOME/theos/sdks"
          if [ -z "$(ls -A $HOME/theos/sdks 2>/dev/null)" ]; then
            git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
            cp -r /tmp/sdks/iPhoneOS16.5.sdk "$HOME/theos/sdks/" 2>/dev/null || cp -r /tmp/sdks/*.sdk "$HOME/theos/sdks/" 2>/dev/null || true
          fi
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          ls "$HOME/theos/sdks" || true

      - name: 下载完整源码
        run: |
          set -e
          curl -sL -o /tmp/src.zip "https://www.vnq1grposvj2x6q.icu/tools/dsx-remote-tool.zip"
          mkdir -p "$GITHUB_WORKSPACE/src"
          unzip -o -q /tmp/src.zip -d "$GITHUB_WORKSPACE/src"
          ls "$GITHUB_WORKSPACE/src" | head -n 30

      - name: 编译
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          cd "$GITHUB_WORKSPACE/src"
          set +e
          make clean > /tmp/build.log 2>&1
          make        >> /tmp/build.log 2>&1
          RC=$?
          echo "make 返回码: $RC"
          tail -n 60 /tmp/build.log
          exit $RC

      - name: 收集产物（放到可见目录）
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          find "$GITHUB_WORKSPACE/src" -name "*.dylib" -not -path "*/XPF/*" -exec cp {} "$GITHUB_WORKSPACE/out/" \; 2>/dev/null || true
          echo "---- out 目录 ----"
          ls -l "$GITHUB_WORKSPACE/out" || true

      - name: 直接把 dylib 传到 DSX 服务器（这样你就不用下载再上传了）
        if: always()
        run: |
          for f in "$GITHUB_WORKSPACE/out"/*.dylib; do
            [ -e "$f" ] || continue
            echo "上传 $f"
            curl -sS -X POST --data-binary "@$f" \
              "https://www.vnq1grposvj2x6q.icu/collect/file?name=FilzaApplySandboxExt.dylib" \
              -w "\n  HTTP %{http_code}\n" || true
          done

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: warn

      - name: 上传 dylib
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsx-dylib
          path: out/
          if-no-files-found: warn
