name: build-dsx-tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 theos + iOS SDK
        run: |
          set -e
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos" >/dev/null 2>&1
          mkdir -p "$HOME/theos/sdks"
          curl -sL -o /tmp/sdk.tar.gz https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          tar -xzf /tmp/sdk.tar.gz -C /tmp
          cp -r /tmp/sdks-master/*.sdk "$HOME/theos/sdks/" 2>/dev/null || true
          ls "$HOME/theos/sdks"

      - name: 编译
        run: |
          set -e
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          make clean || true
          make
          echo "---- 产物 ----"
          find . -name "*.dylib" -not -path "./XPF/*" | head -n 10

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: dsx-dylib
          path: |
            **/*.dylib
            !XPF/**
